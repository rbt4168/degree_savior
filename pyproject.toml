[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-automation"
version = "0.1.0"
description = "Evidence-backed research with human topic selection and reproducible experiments"
requires-python = ">=3.10"
dependencies = ["pypdf==6.19.0", "jsonschema==4.26.0", "psutil==7.2.2"]

[project.scripts]
research = "research_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
